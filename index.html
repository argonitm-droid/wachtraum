<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Waking Dream — Hohenfels Sanatorium</title><link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />

<style>html,body{margin:0;background:#081112;color:#dee4d9;font:20px system-ui;width:100%;height:100%;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}#gate,#rotate{position:fixed;inset:0;display:grid;place-content:center;text-align:center;background:#081112;z-index:5;padding:24px}button{font:inherit;padding:20px 40px;color:#e4e5d7;background:#213c38;border:1px solid #81978c;border-radius:6px}progress{width:min(70vw,420px);margin:24px auto}#rotate{display:none;z-index:9}@media(orientation:portrait){#rotate{display:grid}}#error{max-width:80vw;white-space:pre-wrap}</style></head><body><canvas id="canvas"></canvas><section id="gate"><h1 id="title"></h1><p id="place"></p><button id="start"></button><p id="status"></p><progress id="progress" max="1" value="0"></progress><p id="error"></p></section><section id="rotate"></section><script src="index.js"></script><script>const [title,place,start,rotate,status,progress,error,gate]=['title','place','start','rotate','status','progress','error','gate'].map(id=>document.getElementById(id));const strings={"TITLE": {"en": "WAKING DREAM", "de": "WACHTRAUM"}, "PLACE": {"en": "Hohenfels Sanatorium", "de": "Kurhaus Hohenfels"}, "TAG": {"en": "A found-footage survival horror prototype", "de": "Ein Survival-Horror-Prototyp im Found-Footage-Stil"}, "START": {"en": "Enter Hohenfels", "de": "Hohenfels betreten"}, "RESUME": {"en": "Resume", "de": "Fortsetzen"}, "RESTART": {"en": "Restart chapter", "de": "Kapitel neu starten"}, "SETTINGS": {"en": "Settings / Language", "de": "Einstellungen / Sprache"}, "JOURNAL": {"en": "Evidence & diary", "de": "Beweise & Tagebuch"}, "CREDITS": {"en": "Credits", "de": "Mitwirkende"}, "QUIT": {"en": "Quit", "de": "Beenden"}, "BACK": {"en": "Back", "de": "Zurück"}, "LANGUAGE": {"en": "Language", "de": "Sprache"}, "ENGLISH": {"en": "English", "de": "Englisch"}, "GERMAN": {"en": "German", "de": "Deutsch"}, "SENSITIVITY": {"en": "Mouse sensitivity", "de": "Mausempfindlichkeit"}, "VOLUME": {"en": "Audio volume", "de": "Lautstärke"}, "MOTION": {"en": "Camera movement", "de": "Kamerabewegung"}, "WARNING": {"en": "Headphones recommended. Contains pursuit, disturbing clinical themes and flickering lights. No weapons.", "de": "Kopfhörer empfohlen. Enthält Verfolgung, verstörende Klinikthemen und flackerndes Licht. Keine Waffen."}, "CONTROLS": {"en": "WASD move · Mouse / arrows look · Shift sprint · Ctrl crouch\nE use / leave hiding · C camcorder · N night vision · R record\nF camera lamp · B battery · J journal · Esc menu", "de": "WASD bewegen · Maus / Pfeile umsehen · Shift sprinten · Strg ducken\nE benutzen / Versteck verlassen · C Camcorder · N Nachtsicht · R aufnehmen\nF Kameralicht · B Batterie · J Tagebuch · Esc Menü"}, "HUD": {"en": "{rec}    {time}    BAT {battery}%    {spare} ×    {chapter}/5", "de": "{rec}    {time}    BAT {battery}%    {spare} ×    {chapter}/5"}, "REC": {"en": "REC ●", "de": "REC ●"}, "STANDBY": {"en": "STBY", "de": "STBY"}, "BAT_LOW": {"en": "Battery low. Press B to replace.", "de": "Batterie schwach. Mit B ersetzen."}, "NO_BAT": {"en": "No spare batteries. Search the side rooms.", "de": "Keine Ersatzbatterien. Suche in den Nebenräumen."}, "BAT_ADDED": {"en": "Spare battery collected.", "de": "Ersatzbatterie eingesteckt."}, "BAT_CHANGED": {"en": "Battery replaced.", "de": "Batterie ersetzt."}, "HIDDEN": {"en": "Hidden · E to leave", "de": "Versteckt · E zum Verlassen"}, "SEEN": {"en": "He saw you hide. Move!", "de": "Er hat dich beim Verstecken gesehen. Weg hier!"}, "PROMPT": {"en": "E · {name}", "de": "E · {name}"}, "SAVED": {"en": "Evidence secured. Record the scene at the red lamp.", "de": "Beweis gesichert. Filme die Szene bei der roten Lampe."}, "RECORD_HINT": {"en": "Hold the scene in frame while recording.", "de": "Halte die Szene während der Aufnahme im Bild."}, "DIARY_SAVED": {"en": "Recording saved to Lena’s diary. Find the exit.", "de": "Aufnahme in Lenas Tagebuch gespeichert. Finde den Ausgang."}, "LOCKED": {"en": "Document the evidence and record the scene first.", "de": "Sichere zuerst den Beweis und filme die Szene."}, "DEAD": {"en": "SIGNAL LOST", "de": "SIGNAL VERLOREN"}, "DEAD_BODY": {"en": "The Night Warden found Lena. Your current chapter can be restarted.", "de": "Der Nachtwächter hat Lena gefunden. Du kannst das aktuelle Kapitel neu starten."}, "ENDING": {"en": "05:41 — NO MORE SLEEP", "de": "05:41 — KEIN SCHLAF MEHR"}, "ENDING_BODY": {"en": "The roof door opens. There is snow on the mountain, but none on Lena’s shoes.\nThe camera has been recording for ninety-six hours.\nOn its screen, the gate is still open.", "de": "Die Dachtür öffnet sich. Auf dem Berg liegt Schnee, aber keiner haftet an Lenas Schuhen.\nDie Kamera zeichnet seit sechsundneunzig Stunden auf.\nAuf ihrem Display steht das Tor noch immer offen."}, "EMPTY_JOURNAL": {"en": "No evidence recorded yet.", "de": "Noch keine Beweise aufgezeichnet."}, "INTRO": {"en": "Lena Kessler, 31. Insurance damage assessor.\nVeritas Clinic Group reports a fire at a clinic closed since 1998.\nAn anonymous message: “They never stopped waking them.”\nBehind you, the main gate locks.", "de": "Lena Kessler, 31. Versicherungsgutachterin.\nDie Veritas Clinic Group meldet einen Brand in einer seit 1998 geschlossenen Klinik.\nEine anonyme Nachricht: „Sie haben nie aufgehört, sie wachzuhalten.“\nHinter dir verriegelt sich das Haupttor."}, "CH_1": {"en": "01 / Arrival", "de": "01 / Ankunft"}, "CH_2": {"en": "02 / The Dormitory", "de": "02 / Der Schlafsaal"}, "CH_3": {"en": "03 / Hydrotherapy", "de": "03 / Hydrotherapie"}, "CH_4": {"en": "04 / Senn’s Laboratory", "de": "04 / Senns Labor"}, "CH_5": {"en": "05 / Awakening", "de": "05 / Erwachen"}, "OBJ_FIND": {"en": "Find the file marked by a desk lamp. Walk quietly; keys mean danger.", "de": "Finde die Akte bei der Schreibtischlampe. Geh leise; Schlüssel bedeuten Gefahr."}, "OBJ_RECORD": {"en": "R: Record the evidence scene under the red light.", "de": "R: Filme die Beweisszene unter dem roten Licht."}, "OBJ_EXIT": {"en": "Reach the exit at the far end of the corridor.", "de": "Erreiche den Ausgang am Ende des Korridors."}, "SIGN_ADMIN": {"en": "ADMINISTRATION", "de": "VERWALTUNG"}, "SIGN_WARD": {"en": "PATIENT WING", "de": "PATIENTENTRAKT"}, "SIGN_BATH": {"en": "HYDROTHERAPY", "de": "HYDROTHERAPIE"}, "SIGN_LAB": {"en": "SENN / RESEARCH", "de": "SENN / FORSCHUNG"}, "SIGN_ROOF": {"en": "ROOF ACCESS", "de": "DACHAUSGANG"}, "SIGN_EXIT": {"en": "EXIT →", "de": "AUSGANG →"}, "SIGN_VERITAS": {"en": "Veritas Clinic Group\nHohenfels · 1998", "de": "Veritas Clinic Group\nHohenfels · 1998"}, "LOCKER": {"en": "Hide in locker", "de": "Im Spind verstecken"}, "BED": {"en": "Hide under bed", "de": "Unter dem Bett verstecken"}, "VENT": {"en": "Hide in ventilation shaft", "de": "Im Lüftungsschacht verstecken"}, "FILE": {"en": "Read file", "de": "Akte lesen"}, "TAPE": {"en": "Play tape", "de": "Tonband abspielen"}, "BATTERY": {"en": "Take battery", "de": "Batterie nehmen"}, "EXIT": {"en": "Open chapter exit", "de": "Kapitelausgang öffnen"}, "WATER": {"en": "Water damage: intermittent camera signal.", "de": "Wasserschaden: Kamerasignal unterbrochen."}, "WHISPER": {"en": "Don’t shine the light on us. The keys tell you when to hide.", "de": "Leuchte uns nicht an. Die Schlüssel sagen dir, wann du dich verstecken musst."}, "NOTE_1": {"en": "Fire report / 1998\nThe north wing was declared empty. Electricity consumption continued at full occupancy. Veritas requested that no photographs be taken.", "de": "Brandbericht / 1998\nDer Nordflügel wurde als leer deklariert. Der Stromverbrauch entsprach weiter der Vollbelegung. Veritas verlangte, keine Fotos aufzunehmen."}, "NOTE_2": {"en": "Ward log / night 47\nThe patients call themselves The Wakeful. Some still remember their names. Those who flinch from the lamps must not be illuminated.", "de": "Stationsbuch / Nacht 47\nDie Patienten nennen sich Die Wachen. Einige kennen ihre Namen noch. Wer vor den Lampen zurückzuckt, darf nicht angeleuchtet werden."}, "NOTE_3": {"en": "Hydrotherapy order\nCold immersion every ninety minutes. Do not let the subjects close their eyes. The water is rising. Nobody has come to repair the pumps.", "de": "Hydrotherapie-Anordnung\nAlle neunzig Minuten kaltes Tauchbad. Die Versuchspersonen dürfen die Augen nicht schliessen. Das Wasser steigt. Niemand kommt, um die Pumpen zu reparieren."}, "NOTE_4": {"en": "Project Waking Dream / Dr. Albrecht Senn\nMonth three: wakefulness persists. Identity does not. The fully awake human no longer distinguishes memory from perception. Subject Kessler is responding.", "de": "Projekt Wachtraum / Dr. Albrecht Senn\nMonat drei: Wachheit bleibt bestehen. Identität nicht. Der vollständig wache Mensch unterscheidet Erinnerung nicht mehr von Wahrnehmung. Versuchsperson Kessler spricht an."}, "NOTE_5": {"en": "Personal effects / Lena Kessler\nCamcorder. Empty battery packaging. Insurance credentials dated four days in the future. No record of admission. No record of discharge.", "de": "Persönliche Gegenstände / Lena Kessler\nCamcorder. Leere Batterieverpackungen. Versicherungsausweis, datiert auf vier Tage in der Zukunft. Keine Aufnahme dokumentiert. Keine Entlassung dokumentiert."}, "DIARY_1": {"en": "I recorded the locked intake room. The fire was a pretext. Someone has been cleaning around the beds.", "de": "Ich habe den verriegelten Aufnahmeraum gefilmt. Der Brand war ein Vorwand. Jemand hat um die Betten herum geputzt."}, "DIARY_2": {"en": "The Wakeful do not all want to hurt me. One showed me a locker. I heard the Warden’s keys before I saw him.", "de": "Die Wachen wollen mir nicht alle etwas antun. Einer zeigte mir einen Spind. Ich hörte die Schlüssel des Wächters, bevor ich ihn sah."}, "DIARY_3": {"en": "The bath is still warm. The camera keeps cutting out. I cannot remember when I last slept.", "de": "Das Bad ist noch warm. Die Kamera fällt immer wieder aus. Ich weiss nicht mehr, wann ich zuletzt geschlafen habe."}, "DIARY_4": {"en": "Senn used my name on the tape. It was recorded before I arrived. Or I arrived before I remember.", "de": "Senn benutzte meinen Namen auf dem Band. Es wurde vor meiner Ankunft aufgenommen. Oder ich kam früher, als ich mich erinnere."}, "DIARY_5": {"en": "The roof. Dawn. My hands are shaking. The timestamp says this is my fourth night.", "de": "Das Dach. Morgengrauen. Meine Hände zittern. Laut Zeitstempel ist dies meine vierte Nacht."}, "VOICE_1": {"en": "Dr. Senn: Welcome, Ms. Kessler. You are here to document the damage. Please be thorough.", "de": "Dr. Senn: Willkommen, Frau Kessler. Sie sind hier, um den Schaden zu dokumentieren. Bitte seien Sie gründlich."}, "VOICE_2": {"en": "Dr. Senn: Sleep is not recovery. Sleep is the interruption of progress.", "de": "Dr. Senn: Schlaf ist keine Erholung. Schlaf ist die Unterbrechung des Fortschritts."}, "VOICE_3": {"en": "Dr. Senn: The water keeps them awake. Do not listen to what they say.", "de": "Dr. Senn: Das Wasser hält sie wach. Hören Sie nicht darauf, was sie sagen."}, "VOICE_4": {"en": "Dr. Senn: We wanted to create a human who never sleeps. Lena, you know the price.", "de": "Dr. Senn: Wir wollten einen Menschen erschaffen, der niemals schläft. Lena, Sie kennen den Preis."}, "VOICE_5": {"en": "Dr. Senn: How many nights has it been, Lena? You may open your eyes now.", "de": "Dr. Senn: Wie viele Nächte sind es jetzt, Lena? Sie dürfen die Augen jetzt öffnen."}, "CREDITS_BODY": {"en": "Concept: Argonit Munishi · Implementation: Codex\nGodot 4 / Blender. Edited CC0 Innerscene and MakeHuman meshes.\nGerman synthetic voice: Kyutai Pocket TTS, Juergen preset.\nOriginal procedural surfaces, sound effects and atmosphere.\nPrototype: five compact chapters; no commercial assets or paid services.\nSee README for sources, limitations and export instructions.", "de": "Konzept: Argonit Munishi · Umsetzung: Codex\nGodot 4 / Blender. Bearbeitete CC0-Modelle von Innerscene und MakeHuman.\nDeutsche KI-Stimme: Kyutai Pocket TTS, Vorgabe Juergen.\nEigene prozedurale Oberflächen, Klänge und Atmosphäre.\nPrototyp: fünf kompakte Kapitel; keine gekauften Assets oder Dienste.\nQuellen, Grenzen und Exportanleitung stehen in der README."}, "VERSION": {"en": "WEB / CO-OP PROTOTYPE 0.2", "de": "WEB-/KOOP-PROTOTYP 0.2"}, "COOP_LOBBY": {"en": "Online co-op · 2 players", "de": "Online-Koop · 2 Spieler"}, "SIGNAL_URL": {"en": "Signaling server URL (wss://)", "de": "Adresse des Signalisierungsservers (wss://)"}, "ROOM_CODE": {"en": "Room code", "de": "Raumcode"}, "HOST": {"en": "Create room · Lena", "de": "Raum erstellen · Lena"}, "JOIN": {"en": "Join room · Elias", "de": "Raum beitreten · Elias"}, "INVITE": {"en": "Copy invitation link", "de": "Einladungslink kopieren"}, "NET_WAITING": {"en": "Waiting for Elias. Share the room code.", "de": "Warte auf Elias. Teile den Raumcode."}, "NET_CONNECTING": {"en": "Connecting… A sleeping free server may take a minute.", "de": "Verbindung wird aufgebaut … Ein ruhender Gratisserver kann eine Minute brauchen."}, "NET_CONNECTED": {"en": "Radio contact established.", "de": "Funkkontakt hergestellt."}, "NET_FAIL": {"en": "Server unreachable. Check its URL and allowed origins.", "de": "Server nicht erreichbar. Prüfe Adresse und erlaubte Ursprünge."}, "NET_DIRECT_FAIL": {"en": "Direct connection failed. STUN cannot cross every firewall. Try another network; a TURN relay would be needed here.", "de": "Direktverbindung fehlgeschlagen. STUN überwindet nicht jede Firewall. Versuche ein anderes Netzwerk; hier wäre ein TURN-Relay nötig."}, "NET_WEB_ONLY": {"en": "Online mode requires the browser build.", "de": "Online-Modus benötigt die Browser-Version."}, "NET_URL": {"en": "Enter a secure wss:// server URL.", "de": "Trage eine sichere wss://-Serveradresse ein."}, "NET_CODE": {"en": "Enter the six-character room code.", "de": "Gib den sechsstelligen Raumcode ein."}, "NET_MISSING": {"en": "Room not found. Ask Lena to create another room.", "de": "Raum nicht gefunden. Bitte Lena, einen neuen Raum zu erstellen."}, "NET_FULL": {"en": "Room or server is full.", "de": "Raum oder Server ist voll."}, "NET_BAD": {"en": "Invalid signaling message.", "de": "Ungültige Verbindungsnachricht."}, "NET_HOST_LEFT": {"en": "Lena disconnected. The host session has ended.", "de": "Lena hat die Verbindung verloren. Die Host-Sitzung wurde beendet."}, "NET_GUEST_LEFT": {"en": "Elias disconnected. Continue solo; he can rejoin with the same room code.", "de": "Elias hat die Verbindung verloren. Spiele solo weiter; er kann mit demselben Code zurückkehren."}, "NET_HELP": {"en": "Lena hosts; Elias joins. Configure the server once on each device. Language stays local.", "de": "Lena erstellt den Raum, Elias tritt bei. Serveradresse einmal pro Gerät einstellen. Die Sprache bleibt lokal."}, "NET_HUD": {"en": "{role} · Radio {ping} ms", "de": "{role} · Funk {ping} ms"}, "DOWNED": {"en": "Downed · {seconds} seconds left", "de": "Verletzt · noch {seconds} Sekunden"}, "REVIVE": {"en": "Hold E / Use near your partner for 3 seconds to revive.", "de": "Halte E / Benutzen 3 Sekunden neben deinem Partner zum Wiederbeleben."}, "COOP_LEVER": {"en": "Hold E / Use: keep the gate open", "de": "E / Benutzen halten: Tor offen halten"}, "COOP_LATCH": {"en": "Release the gate latch", "de": "Torriegel lösen"}, "COOP_READ_CODE": {"en": "Read the wall code", "de": "Wandcode lesen"}, "COOP_CODE": {"en": "Access code:", "de": "Zugangscode:"}, "COOP_KEYPAD": {"en": "Enter partner’s code", "de": "Code des Partners eingeben"}, "COOP_SUBMIT": {"en": "Confirm code", "de": "Code bestätigen"}, "ENDING_COOP": {"en": "Lena finds Elias on the roof. His radio plays her own breathing. Neither can remember meeting the other. Two shadows cross the snow. The recording shows only one.", "de": "Lena findet Elias auf dem Dach. Sein Funkgerät spielt ihren eigenen Atem. Keiner erinnert sich an die erste Begegnung. Zwei Schatten ziehen über den Schnee. Die Aufnahme zeigt nur einen."}, "PING_DANGER": {"en": "⚠ Danger", "de": "⚠ Gefahr"}, "PING_HERE": {"en": "◎ Here", "de": "◎ Hier"}, "PING_HIDE": {"en": "◼ Hide", "de": "◼ Verstecken"}, "PING_COME": {"en": "➜ Come", "de": "➜ Komm"}, "ROTATE": {"en": "Please rotate your device to landscape.", "de": "Bitte drehe dein Gerät ins Querformat."}, "GRAPHICS": {"en": "Graphics quality", "de": "Grafikqualität"}, "LOW": {"en": "Low", "de": "Niedrig"}, "MEDIUM": {"en": "Medium", "de": "Mittel"}, "HIGH": {"en": "High", "de": "Hoch"}, "TOUCH_SIZE": {"en": "Touch button size", "de": "Grösse der Touch-Tasten"}, "TOUCH_LAYOUT": {"en": "Move touch buttons (Esc / Menu to finish)", "de": "Touch-Tasten verschieben (Esc / Menü zum Beenden)"}, "EXPORT_SAVE": {"en": "Export checkpoint", "de": "Spielstand exportieren"}, "IMPORT_SAVE": {"en": "Import checkpoint", "de": "Spielstand importieren"}, "LOAD_SAVE": {"en": "Continue checkpoint", "de": "Spielstand fortsetzen"}, "SAVE_NONE": {"en": "No saved checkpoint yet.", "de": "Noch kein Spielstand vorhanden."}, "SAVE_BAD": {"en": "Invalid save file.", "de": "Ungültige Spielstandsdatei."}, "ELIAS_RADIO": {"en": "Elias: Lena, I hear you. Follow the corridor. Stay away from the keys.", "de": "Elias: Lena, ich höre Sie. Folgen Sie dem Flur. Halten Sie sich von den Schlüsseln fern."}, "TAP_START": {"en": "Tap to start", "de": "Zum Starten antippen"}, "LOADING": {"en": "Loading Hohenfels…", "de": "Hohenfels wird geladen …"}, "WEB_ERROR": {"en": "The game could not start. Check WebGL 2 support and reload.", "de": "Das Spiel konnte nicht starten. Prüfe WebGL-2-Unterstützung und lade neu."}, "TOUCH_SPRINT": {"en": "Sprint", "de": "Sprint"}, "TOUCH_CROUCH": {"en": "Crouch", "de": "Ducken"}, "TOUCH_USE": {"en": "Use / Hide", "de": "Benutzen"}, "TOUCH_CAMERA": {"en": "Camera", "de": "Kamera"}, "TOUCH_NIGHT": {"en": "Night vision", "de": "Nachtsicht"}, "TOUCH_LIGHT": {"en": "Light", "de": "Licht"}, "TOUCH_RECORD": {"en": "Record", "de": "Aufnahme"}, "TOUCH_BATTERY": {"en": "Battery", "de": "Batterie"}, "TOUCH_RADIO": {"en": "Radio", "de": "Funk"}, "TOUCH_JOURNAL": {"en": "Diary", "de": "Tagebuch"}, "TOUCH_PAUSE": {"en": "Menu", "de": "Menü"}, "TOUCH_HIDE": {"en": "Hide", "de": "Verstecken"}};const lang=navigator.language.startsWith('de')?'de':'en';const t=k=>strings[k][lang];title.textContent=t('TITLE');place.textContent=t('PLACE');start.textContent=t('TAP_START');rotate.textContent=t('ROTATE');const config={"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":1333504,"index.wasm":37700666},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};const engine=new Engine(config);start.onclick=async()=>{start.disabled=true;try{if(Engine.getMissingFeatures({threads:false}).length){error.textContent=t('WEB_ERROR');start.disabled=false;return;}const ctx=new (window.AudioContext||window.webkitAudioContext)();ctx.resume();document.documentElement.requestFullscreen?.().catch(()=>{});screen.orientation?.lock?.('landscape').catch(()=>{});status.textContent=t('LOADING');await engine.startGame({canvas:document.getElementById('canvas'),onProgress:(loaded,total)=>{if(total)progress.value=loaded/total;}});gate.remove();engine.installServiceWorker?.().catch(()=>{});}catch(e){error.textContent=t('WEB_ERROR')+'\n'+e.message;start.disabled=false;}};window.wachtraumImport=()=>{const f=document.createElement('input');f.type='file';f.accept='.json,application/json';f.onchange=async()=>{const file=f.files[0];if(file&&file.size<65536)window.wachtraumSave=await file.text();};f.click();};</script></body></html>
